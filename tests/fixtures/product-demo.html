<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>PrivAgent Product Demo</title>
    <style>
      body { font: 16px system-ui; max-width: 560px; margin: 48px auto; padding: 0 20px; }
      label { display: block; margin: 14px 0; }
      input { box-sizing: border-box; display: block; margin-top: 5px; padding: 9px; width: 100%; }
      button { padding: 10px 18px; }
      #result { color: #067647; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Saved Details Demo</h1>
    <form id="profile-form">
      <label>Name <input name="name" autocomplete="off"></label>
      <label>Email <input name="email" type="email" autocomplete="off"></label>
      <label>Phone <input name="phone" type="tel" autocomplete="off"></label>
      <label>Address <input name="address" autocomplete="off"></label>
      <button type="submit">Submit</button>
    </form>
    <p id="result" role="status"></p>
    <script>
      document.getElementById('profile-form').addEventListener('submit', (event) => {
        event.preventDefault();
        document.getElementById('result').textContent = 'PROFILE SUBMITTED';
        event.currentTarget.querySelector('button').disabled = true;
      });
    </script>
  </body>
</html>
